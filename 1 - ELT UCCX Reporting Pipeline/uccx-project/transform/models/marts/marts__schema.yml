version: 2

models:
  - name: fact_agent_month
    description: "Fact Agent Monthly"
    columns:
      - name: fact_agent_month_key
        description: The primary key for this table
      - name: dim_agent_key
        description: The foreign key for dim_agent table
      - name: dim_agent_state_key
        description: foreign key for the dim_agent_state table
      - name: dim_date_key
        description: The foreign key for date table
      - name: report_period
      - name: agent_id     
      - name: calls_presented_agent
      - name: calls_handled_agent
      - name: handle_ratio_agent
      - name: avg_handle_time
      - name: avg_talk_time
      - name: work_time
      - name: ready_percent
      - name: not_ready_percent
      - name: idle_time
      - name: transfers_in
      - name: transfers_out
      - name: conference_calls
      - name: ready_percent
      - name: not_ready_percent

      
  - name: fact_agent_state_day
    description: "Fact Agent State Daily"
    columns:
      - name: fact_agent_state_key
        description: The primary key for this table
      - name: dim_agent_key
        description: The foreign key for the dim_agent table
      - name: dim_date_key
        description: The foreign key for the date key
      - name: agent_id    
      - name: agent_state
      - name: state_transition_time
      - name: state_duration
      - name: state_reason 


  - name: fact_csq_month
    description: "Fact Contact Service Monthly" 
    columns:
      - name: fact_csq_month_key
        description: The primary key for this table
      - name: dim_csq_key
        description: The foreign key for the dim_csq_month table
      - name: dim_date_key
        description: The foreign key for the date table
      - name: report_period     
      - name: calls_presented_csq
      - name: calls_handled_csq
      - name: calls_abandoned_csq
      - name: avg_queue_time
      - name: max_queue_time
      - name: avg_speed_of_answer


  - name: dim_agents
    description: "Agent Dimensions" 
    columns:
      - name: dim_agent_key
        description: The primary key for this table
        data_tests:
          - unique
          - not_null        
      - name: agent_id
      - name: agent_name
      - name: agent_extension


  - name: dim_csq
    description: "Contact Servie Queue Dimensions" 
    columns:
      - name: dim_csq_key
        description: The primary key for this table
        data_tests:
          - unique
          - not_null        
      - name: csq_id
      - name: csq_name


  - name: dim_date
    description: "Date Dimensions"
    columns:
      - name: dim_date_key
        description: The primary key for this table
        data_tests:
          - unique
          - not_null        
      - name: day_of_week
      - name: month 
      - name: quarter
      - name: year


     